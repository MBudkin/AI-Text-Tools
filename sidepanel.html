<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Text Tools</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:flex;flex-direction:column;color:#e7edf7;background:#101722;font:13px/1.5 Inter,system-ui,sans-serif}
    button,input,textarea,select{font:inherit}button{display:inline-grid;place-items:center;border:1px solid transparent;border-radius:8px;cursor:pointer;color:#cbd5e4;background:#243044}button:hover{border-color:#53627a;filter:brightness(1.08)}
    header{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:10px;border-bottom:1px solid #2b374a;background:#151e2b;transition:.2s background,.2s border-color}
    body.temporary header{border-color:#8b6a22;background:linear-gradient(135deg,#4a3818,#262315)}
    .brand{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;background:linear-gradient(135deg,#775fff,#438cff);font-weight:800}.title{min-width:0;flex:1}.title strong,.title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title span{color:#8c9ab0;font-size:10px}
    .icon{width:30px;height:30px;padding:0;font-size:15px;line-height:1}.header-button{width:auto;padding:0 9px;height:30px;white-space:nowrap}.temporary-button.active{border-color:#d7a93b;color:#fff;background:#76591e}
    .draft-controls{flex:0 0 auto;padding:9px 10px;border-bottom:1px solid #283448;background:#121a26}.contexts{display:flex;flex-wrap:wrap;gap:5px;overflow:visible;padding-bottom:7px}.context{flex:0 0 auto;max-width:100%;padding:5px 8px;color:#a9b5c7;background:#1a2433;white-space:normal;text-align:center}.context.active{border-color:#776cff;color:#fff;background:#302e61}.context:disabled{opacity:.42;cursor:not-allowed;filter:none;border-color:#344158;background:#171f2b}.page-link-option{display:flex;align-items:center;gap:7px;margin:-1px 0 7px;padding:5px 7px;border:1px solid #2f3b50;border-radius:8px;color:#aeb9ca;background:#171f2c;cursor:pointer;font-size:11px}.page-link-option input{width:14px;height:14px;min-width:14px;margin:0;padding:0;accent-color:#7567f2}.page-link-option span{color:#7f8da3}
    .model-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(112px,.65fr);gap:7px}input,select,textarea{min-width:0;border:1px solid #344158;border-radius:8px;outline:0;color:inherit;background:#0c121b}input,select{height:35px;padding:0 8px}textarea{display:block;width:100%;height:34px;min-height:34px;max-height:160px;padding:6px 9px;resize:none;overflow:hidden;line-height:20px}input:focus,select:focus,textarea:focus{border-color:#776cff;box-shadow:0 0 0 2px #776cff22}
    .chat{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:11px;overflow:auto;overflow-anchor:none;padding:11px 10px;overscroll-behavior:auto;scrollbar-gutter:stable}.message-row{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;max-width:100%;overflow-anchor:none}.message-row.user-row{align-items:flex-end}.message{min-width:0;max-width:100%;padding:10px 11px;border-radius:12px;overflow-wrap:anywhere}.user{max-width:92%;background:#2d3763;white-space:pre-wrap}.assistant{width:100%;border:1px solid #2c394e;background:#17212f}.outside-tools{display:flex;flex-direction:row;gap:2px;min-height:23px}.tool{width:27px;height:27px;padding:0;border-color:transparent;border-radius:7px;color:#8f9db2;background:transparent;font-size:15px;line-height:1}.outside-tools .tool{width:23px;height:23px;border-radius:6px;font-size:13px}.tool:hover,.tool.active{color:#fff;background:#26344a}.tool.active{border-color:#6158a0}
    .answer>:first-child{margin-top:0}.answer>:last-child{margin-bottom:0}.answer p{margin:.6em 0}.answer a{color:#76bfff;text-decoration-color:#76bfff88;text-underline-offset:2px}.answer a:hover{color:#a8d7ff;text-decoration-color:currentColor}.stream-stable>:first-child,.stream-tail>:first-child{margin-top:0}.stream-stable>:last-child,.stream-tail>:last-child{margin-bottom:0}.stream-stable:not(:empty)+.stream-tail:not(:empty){margin-top:.6em}.answer code{padding:2px 4px;border-radius:4px;color:#e9c6ff;background:#090e15}.answer .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:3px 0}.code-wrap,.table-wrap{position:relative;max-width:100%;margin:8px 0;padding-top:25px;overflow:hidden}.code-wrap{border-radius:8px;background:#080d14}.answer .code-wrap pre{max-width:100%;margin:0;overflow:auto;padding:9px 10px 10px;border-radius:0;color:#edf2fa;background:transparent}.answer pre code{padding:0;color:inherit;background:transparent}.table-scroll{max-width:100%;overflow:auto}.answer table{width:max-content;border-collapse:collapse}.answer th,.answer td{max-width:320px;padding:6px;border:1px solid #3b4960;text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.table-cell-content{min-width:0;max-width:320px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.table-cell-content code{white-space:break-spaces;overflow-wrap:anywhere;word-break:break-word}.block-copy{position:absolute;top:2px;right:3px;z-index:2;width:21px;height:21px;border-radius:6px;background:#202c3e;font-size:12px}
    .reasoning{margin-bottom:8px;border:1px solid #344158;border-radius:9px;color:#94a2b8;background:#101722}.reasoning summary{padding:6px 8px;cursor:pointer;font-size:11px;font-style:italic}.reasoning-text{max-height:112px;overflow:auto;padding:0 8px 7px;white-space:pre-wrap;font-size:11px;font-style:italic}.context-spoiler{position:relative;z-index:0;max-width:100%;margin-top:8px;overflow:hidden;border-top:1px solid #ffffff1f;color:#c3cce0}.context-spoiler summary{padding-top:7px;cursor:pointer;font-size:11px}.context-spoiler pre{width:100%;min-width:0;max-width:100%;max-height:220px;margin:7px 0 0;overflow:auto;overscroll-behavior:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.45 inherit}.context-marker,.image-marker{display:inline-flex;align-items:center;margin-top:7px;margin-right:5px;padding:2px 7px;border:1px solid #ffffff1f;border-radius:999px;color:#aeb9cc;font-size:10px}.message-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.message-image,.attachment-view{display:block;width:auto;height:auto;padding:2px;border:1px solid #ffffff2b;border-radius:8px;background:#172033}.message-image img{display:block;width:64px;height:64px;border-radius:6px;object-fit:cover}.status{margin-top:7px;color:#8998ad;font-size:10px}.attachments{display:flex;gap:8px;overflow-x:auto;padding:8px 2px}.attachment{position:relative;flex:0 0 auto;padding:3px;border:1px solid #3b4960;border-radius:10px;background:#151e2b}.attachment img{display:block;width:48px;height:48px;border-radius:6px;object-fit:cover}.attachment-view{padding:0;border:0;background:transparent}.attachment .attachment-remove{position:absolute;top:-7px;right:-7px;width:19px;height:19px;padding:0;border:2px solid #101722;border-radius:50%;color:#fff;background:#b83e4f}.image-viewer{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:1fr auto;place-items:center;padding:44px 18px 18px;background:#05070bd9;backdrop-filter:blur(5px)}.image-viewer img{max-width:100%;max-height:calc(100vh - 90px);border-radius:10px;box-shadow:0 18px 60px #000b;object-fit:contain}.image-viewer-close{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-color:#ffffff44;border-radius:50%;color:#fff;background:#1a2230e8}.attachment-remove::before,.attachment-remove::after,.image-viewer-close::before,.image-viewer-close::after{content:"";position:absolute;top:50%;left:50%;width:52%;height:1.5px;border-radius:999px;background:currentColor;transform-origin:center}.attachment-remove::before,.image-viewer-close::before{transform:translate(-50%,-50%) rotate(45deg)}.attachment-remove::after,.image-viewer-close::after{transform:translate(-50%,-50%) rotate(-45deg)}.image-viewer-caption{max-width:100%;padding-top:8px;overflow:hidden;color:#d6deeb;text-overflow:ellipsis;white-space:nowrap}.composer{position:relative;flex:0 0 auto;padding:8px 9px 10px;border-top:1px solid #2b374a;background:#101722}.edit-bar{display:flex;align-items:center;gap:7px;margin-bottom:6px;padding:6px 8px;border:1px solid #5d548f;border-radius:8px;color:#c9c3ff;background:#242141;font-size:11px}.edit-bar span{flex:1}.edit-bar button{height:25px;padding:0 7px}.composer-settings{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(100px,.65fr);gap:6px;margin:0 0 6px;padding:7px;border:1px solid #344158;border-radius:9px;background:#151e2b}.composer-settings input,.composer-settings select{height:31px;font-size:11px}.composer-settings .reasoning-budget{grid-column:1/-1}.composer-actions{display:flex;align-items:center;gap:6px;margin-top:6px}.spacer{flex:1}.primary,.stop{height:33px;padding:0 13px;font-weight:700;color:#fff}.primary{border:1px solid #8878ff;background:linear-gradient(135deg,#755cff,#4c72ff)}.stop{border-color:#d96773;background:#a53b49}.drop-overlay{position:fixed;inset:8px;z-index:20;display:grid;place-items:center;border:2px dashed #8b7cff;border-radius:14px;color:#fff;background:#1a2140e8;font-weight:700;pointer-events:none}.hidden{display:none!important}.toast-stack{position:fixed;right:8px;bottom:80px;left:8px;z-index:21;display:grid;gap:6px;pointer-events:none}.toast{padding:9px 10px;border:1px solid #41506a;border-radius:9px;color:#edf2fa;background:#26344a;box-shadow:0 8px 25px #0007}
    *{scrollbar-width:thin;scrollbar-color:#56657d transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:999px;background:#56657d;background-clip:padding-box}
    body.light{color:#1e293b;background:#f5f7fb}body.light header,body.light .composer,body.light .draft-controls{border-color:#d8dfeb;background:#fff}body.light.temporary header{border-color:#d7a93b;background:linear-gradient(135deg,#fff8e8,#f3e7c8)}body.light button{color:#43516a;border-color:#ccd5e3;background:#f8faff}body.light .primary{color:#fff;border-color:#6958ec;background:linear-gradient(135deg,#7058f5,#3d64eb);box-shadow:0 2px 8px #5949d944}body.light .stop{color:#fff;border-color:#963442;background:#bd4050;box-shadow:0 2px 8px #8c263844}body.light input,body.light select,body.light textarea{color:#1e293b;border-color:#cbd5e1;background:#fff}body.light select option{color:#1e293b;background:#fff}body.light select option:checked{color:#fff;background:#6d60ec}body.light .context.active{color:#fff;background:#6d60ec}body.light .page-link-option{color:#4f5f76;border-color:#d2dae7;background:#f5f7fb}body.light .page-link-option span{color:#718096}body.light .assistant{border-color:#d8dfeb;background:#fff}body.light .user{color:#fff;background:#5262a2}body.light .reasoning{color:#536177;border-color:#d4dce8;background:#f3f6fa}body.light .context-spoiler,body.light .context-marker,body.light .image-marker{color:#eef2ff;border-color:#ffffff42}body.light .context-spoiler pre{scrollbar-color:#dbe4ff #435188}body.light .context-spoiler pre::-webkit-scrollbar-track{border-radius:999px;background:#435188}body.light .context-spoiler pre::-webkit-scrollbar-thumb{border-color:#435188;background:#dbe4ff;background-clip:padding-box}body.light .attachment{border-color:#b7c2d2;background:#f7f9fc}body.light .attachment .attachment-remove{border-color:#fff}body.light .message-image{border-color:#ffffff69;background:#3e4e88}body.light .composer-settings{border-color:#cbd5e1;background:#f7f9fc}body.light .edit-bar{color:#4b3d82;border-color:#b7afe4;background:#f0edff}body.light .block-copy{color:#40506a;border-color:#c4cedd;background:#e5ebf3}body.light .answer a{color:#245ec7;text-decoration-color:#245ec777}body.light .answer a:hover{color:#16499f;text-decoration-color:currentColor}body.light .answer code{color:#7a2a91;background:#eee8f2}body.light .answer pre{color:#eef3fa;background:#172033}body.light .answer pre code{color:inherit;background:transparent}
    @media(max-width:520px){.header-button{font-size:11px;padding:0 6px}.brand{display:none}.model-row,.composer-settings{grid-template-columns:1fr}.composer-settings .reasoning-budget{grid-column:1}}
  </style>
</head>
<body>
  <header>
    <div class="brand">AI</div><div class="title"><strong id="title">Новый чат</strong><span id="meta">Подготовьте запрос</span></div>
    <button class="header-button temporary-button" id="temporary" title="Не сохранять этот чат в истории">Временный</button>
    <button class="header-button" id="newChat">Новый чат</button>
    <button class="icon" id="expand" title="Открыть этот чат в отдельном окне">▣</button>
    <button class="icon" id="theme" title="Переключить тему">◐</button>
  </header>
  <section id="draftControls" class="draft-controls"><div id="contexts" class="contexts"></div><label id="pageLinkOption" class="page-link-option hidden"><input id="includePageLinks" type="checkbox">Учитывать ссылки <span id="pageLinkCount"></span></label><div class="model-row"><input id="model" list="models" placeholder="Модель"><select id="thinking"></select></div><datalist id="models"></datalist></section>
  <main id="chat" class="chat"></main>
  <footer class="composer"><div id="attachments" class="attachments hidden"></div><div id="editBar" class="edit-bar hidden"><span>Редактирование сообщения: ответы ниже будут заменены</span><button id="cancelEdit" type="button">Отмена</button></div><div id="chatSettings" class="composer-settings hidden"><input id="chatModel" list="models" placeholder="Модель следующего ответа" title="Модель следующего ответа"><select id="chatThinking" title="Reasoning следующего ответа"></select><input id="chatReasoningBudget" class="reasoning-budget hidden" type="number" min="1" max="128000" step="100" value="2000" placeholder="Custom budget Reasoning"></div><textarea id="input" rows="1" placeholder="Введите запрос…"></textarea><div class="composer-actions"><button class="tool" id="attach" title="Добавить изображения">＋</button><input id="files" type="file" accept="image/*" multiple hidden><button class="tool hidden" id="chatOptions" title="Модель и Reasoning следующего ответа">⚙</button><span class="spacer"></span><button class="primary" id="primary">Отправить</button></div></footer>
  <div id="dropOverlay" class="drop-overlay hidden">Отпустите изображения, чтобы прикрепить</div><div id="toasts" class="toast-stack"></div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="Просмотр изображения"><button id="imageViewerClose" class="image-viewer-close" type="button" title="Закрыть" aria-label="Закрыть"></button><img id="imageViewerImage" alt=""><div id="imageViewerCaption" class="image-viewer-caption"></div></div>
  <script src="marked.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="vendor/katex/contrib/auto-render.min.js"></script><script src="sidepanel.js"></script>
</body>
</html>
