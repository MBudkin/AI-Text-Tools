<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Text Tools</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="common.js"></script>
  <style>
    html,body{width:100%;height:100%;overflow:hidden}
    body{display:flex;flex-direction:column}
    .app-header{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:7px 6px 7px 10px;border-bottom:1px solid var(--border);background:var(--surface);transition:background .2s,border-color .2s}
    .brand{width:22px;height:22px;margin-right:6px}
    .title{min-width:0;flex:1}.title strong,.title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title strong{font-size:13px;font-weight:650}.title span{color:var(--text-3);font-size:11px}
    .temporary-button.active{color:var(--warning-text);background:var(--warning-soft)}
    body.temporary .app-header{border-bottom-color:var(--warning);background:linear-gradient(var(--warning-soft),var(--warning-soft)),var(--surface)}
    .draft-controls{flex:0 0 auto;display:grid;gap:7px;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
    .contexts{display:flex;flex-wrap:wrap;gap:5px}
    .context{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 10px;border:1px solid var(--border-strong);border-radius:999px;cursor:pointer;color:var(--text-2);background:var(--surface-2);font-size:12px;line-height:20px}
    .context .icon-svg{width:13px;height:13px}
    .context:hover:not(:disabled){color:var(--text);border-color:var(--accent-border)}
    .context[aria-pressed="true"]{color:var(--on-accent);border-color:transparent;background:var(--accent)}
    .context:disabled{opacity:.5;cursor:not-allowed}
    .context .over{padding:0 5px;border-radius:999px;color:var(--warning-text);background:var(--warning-soft);font-size:10.5px}
    .context[aria-pressed="true"] .over{color:#fff;background:rgba(0,0,0,.25)}
    .page-link-option{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:12px;cursor:pointer}.page-link-option input{margin:0}.page-link-option span{color:var(--text-3)}
    .model-row,.composer-settings{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(100px,.6fr);gap:6px}
    .model-row input,.model-row select,.composer-settings input,.composer-settings select{height:32px;padding:0 9px;font-size:12px}
    .reasoning-budget{grid-column:1/-1}
    .chat-area{position:relative;flex:1 1 auto;min-height:0;display:flex}
    .chat{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;overflow-anchor:none;padding:14px 10px 18px;scrollbar-gutter:stable}
    .message-row{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;max-width:100%;overflow-anchor:none}
    .message-row.user-row{align-items:flex-end}
    .message{min-width:0;max-width:100%;overflow-wrap:anywhere}
    .user{max-width:88%;padding:8px 12px;border-radius:14px 14px 4px 14px;color:var(--user-text);background:var(--user-bubble);white-space:pre-wrap}
    .assistant{width:100%;padding:0 2px}
    .outside-tools{display:flex;gap:1px;min-height:24px;opacity:.6;transition:opacity .15s}
    .message-row:hover .outside-tools,.message-row:focus-within .outside-tools,.message-row:last-child .outside-tools{opacity:1}
    .stream-stable>:first-child,.stream-tail>:first-child{margin-top:0}.stream-stable>:last-child,.stream-tail>:last-child{margin-bottom:0}.stream-stable:not(:empty)+.stream-tail:not(:empty){margin-top:.6em}
    .waiting{color:var(--text-3)}
    .reasoning{margin-bottom:8px;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-2);background:var(--surface-2)}
    .reasoning summary{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;color:var(--text-3);font-size:11.5px;list-style:none}
    .reasoning summary::-webkit-details-marker{display:none}
    .reasoning summary::before{content:"";width:0;height:0;border:4px solid transparent;border-left:5px solid currentColor;transform-origin:25% 50%;transition:transform .15s}
    .reasoning[open] summary::before{transform:rotate(90deg)}
    .reasoning-text{max-height:140px;overflow:auto;padding:0 10px 8px;white-space:pre-wrap;font-size:11.5px}
    .status{margin-top:6px;color:var(--text-3);font-size:11px}
    .status.generating{display:flex;align-items:center;gap:7px}
    .status.generating::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25;transform:scale(.8)}}
    .status.error{color:var(--danger-text)}
    .context-spoiler{max-width:100%;margin-top:8px;overflow:hidden;border-top:1px solid rgba(255,255,255,.22);color:var(--user-muted)}
    .context-spoiler summary{padding-top:6px;cursor:pointer;font-size:11px}
    .context-spoiler pre{max-height:220px;margin:6px 0 0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.45 var(--font);scrollbar-color:rgba(255,255,255,.4) transparent}
    .context-marker,.image-marker{display:inline-flex;align-items:center;margin:7px 5px 0 0;padding:1px 8px;border:1px solid rgba(255,255,255,.28);border-radius:999px;color:var(--user-muted);font-size:10.5px}
    .message-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .message-image{display:block;padding:0;overflow:hidden;border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:zoom-in;background:transparent}
    .message-image img{display:block;width:64px;height:64px;object-fit:cover}
    .empty-state{display:grid;justify-items:center;gap:8px;margin:auto 0;padding:16px 6px;text-align:center}
    .empty-state img{width:40px;height:40px}
    .empty-state h2{margin:4px 0 0;font-size:15px}
    .empty-state p{max-width:320px;margin:0;color:var(--text-3);font-size:12px}
    .quick-prompts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:420px;margin-top:6px}
    .quick-prompt{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border-strong);border-radius:999px;cursor:pointer;color:var(--text-2);background:var(--surface);font-size:12px}
    .quick-prompt .icon-svg{width:13px;height:13px;color:var(--accent)}
    .quick-prompt:hover:not(:disabled){color:var(--text);border-color:var(--accent-border);background:var(--accent-soft)}
    .quick-prompt:disabled{opacity:.45;cursor:not-allowed}
    kbd{padding:1px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;color:var(--text-2);background:var(--surface-2);font:10.5px/1.4 var(--mono)}
    .scroll-bottom{position:absolute;right:16px;bottom:10px;width:32px;height:32px;border:1px solid var(--border-strong);border-radius:50%;color:var(--text);background:var(--surface);box-shadow:var(--shadow)}
    .composer{position:relative;flex:0 0 auto;padding:8px 10px 10px;border-top:1px solid var(--border);background:var(--bg)}
    .input-card{border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
    .input-card:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .input-card textarea{display:block;width:100%;height:40px;min-height:40px;max-height:200px;padding:10px 12px 2px;border:0;border-radius:12px;resize:none;overflow:hidden;line-height:20px;background:transparent;box-shadow:none}
    .input-card textarea:focus{box-shadow:none}
    .composer-actions{display:flex;align-items:center;gap:2px;padding:2px 6px 6px}
    .composer-hint{margin-left:4px;color:var(--text-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .spacer{flex:1}
    .send{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:50%;cursor:pointer;color:var(--on-accent);background:var(--gradient);box-shadow:var(--shadow-sm);transition:filter .15s,background .15s}
    .send:hover{filter:brightness(1.1)}
    .send.stop{background:var(--danger)}
    .edit-bar,.notice-bar{margin-bottom:6px;padding:6px 6px 6px 10px;border-radius:var(--radius);font-size:12px}
    .edit-bar{display:flex;align-items:center;gap:8px;border:1px solid var(--accent-border);color:var(--text-2);background:var(--accent-soft)}.edit-bar span{flex:1}
    .edit-bar .btn,.notice-bar .btn{min-height:26px;padding:0 10px;font-size:12px}
    .notice-bar{display:grid;gap:6px;border:1px solid color-mix(in srgb,var(--warning) 50%,transparent);color:var(--warning-text);background:var(--warning-soft)}
    .notice-actions{display:flex;flex-wrap:wrap;gap:6px}
    .composer-settings{margin-bottom:6px;padding:7px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
    .attachments{display:flex;gap:8px;overflow-x:auto;padding:8px 2px}
    .attachment{position:relative;flex:0 0 auto;padding:2px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface)}
    .attachment img{display:block;width:48px;height:48px;border-radius:7px;object-fit:cover}
    .attachment-view{display:block;padding:0;border:0;cursor:zoom-in;background:transparent}
    .attachment-remove{position:absolute;top:-7px;right:-7px;display:grid;place-items:center;width:20px;height:20px;padding:0;border:2px solid var(--bg);border-radius:50%;cursor:pointer;color:#fff;background:var(--danger)}
    .attachment-remove .icon-svg{width:11px;height:11px;stroke-width:3}
    .drop-overlay{position:fixed;inset:8px;z-index:50;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:14px;color:var(--text);background:color-mix(in srgb,var(--bg) 88%,transparent);font-weight:650;pointer-events:none}
    .toast-stack{bottom:100px}
    @media(max-width:360px){.brand{display:none}.model-row,.composer-settings{grid-template-columns:1fr}.reasoning-budget{grid-column:1}}
  </style>
</head>
<body>
  <header class="app-header">
    <img class="brand" src="icon48.png" alt="">
    <div class="title"><strong id="title">Новый чат</strong><span id="meta">Подготовьте запрос</span></div>
    <button class="icon-btn temporary-button" id="temporary" type="button" aria-pressed="false"></button>
    <button class="icon-btn" id="newChat" type="button"></button>
    <button class="icon-btn" id="history" type="button"></button>
    <button class="icon-btn" id="expand" type="button"></button>
    <button class="icon-btn" id="theme" type="button"></button>
  </header>
  <section id="draftControls" class="draft-controls">
    <div id="contexts" class="contexts" role="group" aria-label="Контекст запроса"></div>
    <label id="pageLinkOption" class="page-link-option hidden"><input id="includePageLinks" type="checkbox">Учитывать ссылки страницы <span id="pageLinkCount"></span></label>
    <div class="model-row"><input id="model" placeholder="Модель" aria-label="Модель"><select id="thinking" aria-label="Reasoning"></select></div>
  </section>
  <div class="chat-area">
    <main id="chat" class="chat"></main>
    <button id="scrollBottom" class="icon-btn scroll-bottom hidden" type="button" title="К последнему сообщению" aria-label="К последнему сообщению"></button>
  </div>
  <footer class="composer">
    <div id="overflowBar" class="notice-bar hidden" role="alertdialog" aria-live="assertive"></div>
    <div id="attachments" class="attachments hidden"></div>
    <div id="editBar" class="edit-bar hidden"><span>Редактирование: ответы ниже будут заменены</span><button id="cancelEdit" class="btn" type="button">Отмена</button></div>
    <div id="chatSettings" class="composer-settings hidden"><input id="chatModel" placeholder="Модель следующего ответа" aria-label="Модель следующего ответа"><select id="chatThinking" aria-label="Reasoning следующего ответа"></select><input id="chatReasoningBudget" class="reasoning-budget hidden" type="number" min="1" max="128000" step="100" value="2000" placeholder="Лимит токенов Reasoning" aria-label="Лимит токенов Reasoning"></div>
    <div class="input-card">
      <textarea id="input" rows="1" placeholder="Спросите что-нибудь…" aria-label="Запрос"></textarea>
      <div class="composer-actions">
        <button class="icon-btn" id="attach" type="button"></button><input id="files" type="file" accept="image/*" multiple hidden>
        <button class="icon-btn hidden" id="chatOptions" type="button" aria-expanded="false"></button>
        <span id="composerHint" class="composer-hint"></span>
        <span class="spacer"></span>
        <button class="send" id="primary" type="button"></button>
      </div>
    </div>
  </footer>
  <div id="dropOverlay" class="drop-overlay hidden">Отпустите изображения, чтобы прикрепить</div>
  <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="Просмотр изображения"><button id="imageViewerClose" class="icon-btn image-viewer-close" type="button" title="Закрыть" aria-label="Закрыть"></button><img id="imageViewerImage" alt=""><div id="imageViewerCaption" class="image-viewer-caption"></div></div>
  <script src="marked.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="vendor/katex/contrib/auto-render.min.js"></script><script src="sidepanel.js"></script>
</body>
</html>
