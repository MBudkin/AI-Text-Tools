<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>История чатов · AI Text Tools</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="common.js"></script>
  <style>
    body{font-size:14px}
    .topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
    .topbar-inner,.wrap{max-width:1040px;margin:auto;padding:0 24px}
    .topbar-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
    .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
    .brand img{width:36px;height:36px}
    h1{margin:0;font-size:18px}
    .muted{color:var(--text-3);font-size:12px}
    .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .search{position:relative;display:flex;align-items:center}
    .search .icon-svg{position:absolute;left:10px;color:var(--text-3)}
    .search input{width:260px;height:34px;padding:0 10px 0 32px}
    .wrap{padding-top:20px;padding-bottom:40px}
    .list{display:grid;gap:14px}
    .entry{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm)}
    .entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px 10px 14px;border-bottom:1px solid var(--border);color:var(--text-3);font-size:11.5px}
    .entry-head strong{flex:1;min-width:120px;overflow:hidden;color:var(--text);font-size:13.5px;text-overflow:ellipsis;white-space:nowrap}
    .entry-head .btn{min-height:28px;padding:0 10px;font-size:12px}
    .chat-select{width:16px;height:16px;margin:0 2px 0 0;cursor:pointer}
    .pill,.image-badge{display:inline-flex;align-items:center;padding:1px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);white-space:nowrap}
    .image-badge{margin-top:8px;font-size:11px}
    .cell{min-width:0;padding:14px}
    details.context{margin-bottom:12px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-2);background:var(--surface-2)}
    details.context summary{cursor:pointer;font-size:12px}
    details.context pre{max-height:300px;margin:8px 0 0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 var(--mono)}
    .entry,.cell,.conversation,.turn,.markdown{min-width:0;max-width:100%}
    .conversation{display:grid;gap:10px}
    .turn{max-width:88%;padding:10px 12px;border-radius:12px}
    .turn.user{justify-self:end;color:var(--user-text);background:var(--user-bubble);border-bottom-right-radius:4px}
    .turn.assistant{justify-self:stretch;max-width:100%;border:1px solid var(--border);background:var(--surface)}
    .turn.user .md code{color:inherit;background:rgba(255,255,255,.16)}
    .turn.user .md a{color:inherit}
    .label{margin-bottom:6px;color:var(--text-3);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .turn.user .label{color:var(--user-muted)}
    .markdown{font-size:13px}
    .plain-text{margin:0;max-height:420px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.55 var(--mono)}
    .message-images{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
    .message-image{padding:0;overflow:hidden;border:1px solid rgba(255,255,255,.3);border-radius:9px;cursor:zoom-in;background:transparent}
    .message-image img{display:block;width:72px;height:72px;object-fit:cover}
    .empty{display:grid;justify-items:center;gap:8px;padding:56px 20px;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);color:var(--text-3);text-align:center}
    .empty .icon-svg{width:28px;height:28px}
    @media(max-width:760px){.topbar-inner,.wrap{padding-left:14px;padding-right:14px}.search,.search input{width:100%}.tools{width:100%}.turn{max-width:100%}}
  </style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner">
    <div class="brand"><img src="icon48.png" alt=""><div><h1>История чатов</h1><div class="muted" id="count">Локальное хранилище расширения</div></div></div>
    <div class="tools">
      <label class="search"><span class="sr-only">Поиск по чатам</span><span id="searchIcon"></span><input id="search" type="search" placeholder="Поиск по чатам"></label>
      <button id="viewMode" class="btn" type="button">Текст</button>
      <button id="deleteSelected" class="btn btn-danger" type="button" disabled>Удалить выбранные</button>
      <button id="clear" class="btn btn-danger" type="button">Очистить всё</button>
      <button id="theme" class="icon-btn" type="button"></button>
    </div>
  </div></div>
  <div class="wrap"><main id="history" class="list"></main></div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="Просмотр изображения"><button id="imageViewerClose" class="icon-btn image-viewer-close" type="button" title="Закрыть" aria-label="Закрыть"></button><img id="imageViewerImage" alt=""><div id="imageViewerCaption" class="image-viewer-caption"></div></div>
  <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <script src="marked.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="vendor/katex/contrib/auto-render.min.js"></script><script src="history.js"></script>
</body>
</html>
