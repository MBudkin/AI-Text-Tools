<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Text Tools</title>
  <link rel="stylesheet" href="theme.css">
  <script src="common.js"></script>
  <style>
    body{width:340px;padding:12px}
    header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    header img{width:32px;height:32px}
    .heading{min-width:0;flex:1}
    h1{margin:0;font-size:14px;font-weight:700}
    .meta{overflow:hidden;color:var(--text-3);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
    .setup{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:9px 10px;border:1px solid color-mix(in srgb,var(--warning) 50%,transparent);border-radius:var(--radius);color:var(--warning-text);background:var(--warning-soft);font-size:12px}
    .setup .btn{margin-left:auto;min-height:26px;padding:0 10px;font-size:12px}
    .actions{display:grid;gap:4px}
    .action{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;color:var(--text);background:transparent;text-align:left}
    .action:hover:not(:disabled){border-color:var(--border);background:var(--surface-2)}
    .action:disabled{opacity:.5;cursor:not-allowed}
    .action .icon-svg{color:var(--text-3)}
    .action.primary{margin-bottom:4px;color:var(--on-accent);background:var(--gradient);font-weight:650;box-shadow:var(--shadow-sm)}
    .action.primary .icon-svg{color:var(--on-accent)}
    .action.primary:hover:not(:disabled){border-color:transparent;background:var(--gradient);filter:brightness(1.08)}
    .action span{flex:1}
    kbd{padding:1px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;color:var(--text-3);background:var(--surface-2);font:10px/1.4 var(--mono);white-space:nowrap}
    .action.primary kbd{color:var(--on-accent);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;color:var(--text-3);font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
    .chat-list{display:grid;gap:2px;max-height:190px;overflow:auto}
    .chat-row{display:flex;align-items:center;gap:2px;border-radius:var(--radius)}
    .chat-row:hover{background:var(--surface-2)}
    .chat{flex:1;min-width:0;display:grid;gap:1px;padding:6px 8px;border:0;border-radius:var(--radius);cursor:pointer;background:transparent;text-align:left}
    .chat strong{overflow:hidden;font-size:12px;font-weight:550;text-overflow:ellipsis;white-space:nowrap}
    .chat small{overflow:hidden;color:var(--text-3);font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}
    .chat-row .icon-btn{opacity:0}.chat-row:hover .icon-btn,.chat-row .icon-btn:focus-visible{opacity:1}
    .chat-row .icon-btn:hover{color:var(--danger-text);background:var(--danger-soft)}
    .empty{padding:8px 2px;color:var(--text-3);font-size:12px}
    #status{min-height:0;margin-top:8px;color:var(--danger-text);font-size:11.5px}
    #status:empty{display:none}
    footer{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    footer .btn{min-height:30px;padding:0 10px;font-size:12px}
    footer .spacer{flex:1}
  </style>
</head>
<body>
  <header><img src="icon48.png" alt=""><div class="heading"><h1>AI Text Tools</h1><div class="meta" id="summary">Загрузка настроек…</div></div></header>
  <div id="setup" class="setup hidden" role="alert"><span>API-ключ не задан</span><button id="setupButton" class="btn" type="button">Настроить</button></div>
  <div class="actions">
    <button class="action primary" id="openPanel" type="button" data-command="ask-ai"></button>
    <button class="action" data-action="auto" data-command="" type="button"></button>
    <button class="action" data-action="page" data-command="ask-page" type="button"></button>
    <button class="action" data-action="summarize" data-command="summarize-page" type="button"></button>
  </div>
  <div class="section-title"><span>Недавние чаты</span></div>
  <div id="chats" class="chat-list"></div>
  <div id="status" role="alert"></div>
  <footer>
    <button class="btn" id="options" type="button"></button>
    <button class="btn" id="history" type="button"></button>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeToggle" type="button"></button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
